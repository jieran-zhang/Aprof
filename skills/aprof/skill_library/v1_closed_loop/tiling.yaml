skills:
  - id: tiling.increase_blockdim_when_underused
    family: tiling
    version: 17
    scope: production_safe
    preconditions:
      - diagnosis_type == true_bottleneck
      - workload_class == normal
    actionable_edits:
      - from_trajectory: true
        code_changes:
          - restore topk/op_0001 knobs toward baseline for blockdim_too_small
    expected_metric_delta:
      primary: TaskDuration_median_us
      direction: decrease
      min_effect_pct: 3.0
    measurement_policy:
      warm_up: 10
      repeat: 5
