operator:
  name: ArgMax
  category: SortSelect
  difficulty: L2
  formula: indices = argmax(input, dim=dim)
  description: 返回张量在指定维度上的最大值的索引
  shape_support: 输入支持 0-8 维
  attrs:
  - name: dim
    type: int64
    description: 计算 argmax 的维度
    required: true
  - name: keepdim
    type: bool
    description: 是否保留约简维度
    required: false
    default: false
  inputs:
  - name: input
    description: 输入张量
    dtype:
    - float16
    - float32
    - bfloat16
    - int32
    - int64
  outputs:
  - name: indices
    description: 最大值的索引张量，dtype 固定 int64
    dtype:
    - int64
    # 最大值并列时 argmax 的下标非确定（torch CPU 与 NPU kernel 的 tie-break 不同），
    # 逐元素比对会把实现正确的 kernel 判失败。低精度 dtype + 窄值域下并列是常态：
    # 20 个用例里 15 个存在并列切片（c1/c14/c16 达 100%，c3 97.7%，c10 76.5%），
    # 只有 c2/c6/c8/c12/c17 是良定义的。
    # 改用 tie 顺序无关的"指向值"校验：input.gather(dim, indices) 须等于
    # input.amax(dim, keepdim=True)，即索引须指向该切片的最大元素。这是 argmax
    # 除并列顺序外的完整定义，乱填索引仍会被判失败（见 eval/index_check.py）。
    compare: false
    index_gather:
      input: input
      dim_attr: dim
      value_reduce: amax
      keepdim_attr: keepdim
  schema: arg_max(Tensor input, int dim, bool keepdim=false) -> Tensor indices
